services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Localhost only: lets `pnpm dev` on the host reach the DB, never the LAN
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://library:${DB_PASSWORD:-library}@db:5432/library
      LIBRARY_DIR: /data/library
    volumes:
      - ${LIBRARY_HOST_DIR:-./library}:/data/library
    ports:
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  backup:
    image: postgres:18
    environment:
      PGPASSWORD: ${DB_PASSWORD:-library}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Nightly pg_dump of annotations, study history and the index; keeps the last KEEP_DAYS days.
    command:
      - |
        while true; do
          f=/backups/library-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U library library | gzip > "$$f" && echo "backup: $$f"
          find /backups -name 'library-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
